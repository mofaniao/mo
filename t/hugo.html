  <script>
  (function() {
    // 主题切换
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    var toggleBtn = document.getElementById('themeToggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    }
  })();
  </script>
  
  <script>
  // 无限滚动加载 - 使用 textContent 防止 XSS
  (function() {
    var list = document.getElementById('postsList');
    var loader = document.getElementById('loadMore');
    if (!list || !loader) return;

    var page = 1;
    var perPage = 10;
    var loading = false;
    var allLoaded = !document.getElementById('loadMoreBtn');
    var postsCache = null;

    /**
     * HTML 转义函数（客户端版）
     */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function loadPosts() {
      if (loading || allLoaded) return;
      loading = true;
      var btn = document.getElementById('loadMoreBtn');
      if (btn) btn.classList.add('loading');

      if (!postsCache) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/posts.json', true);
        xhr.onload = function() {
          if (xhr.status === 200) {
            try {
              postsCache = JSON.parse(xhr.responseText);
              appendPosts();
            } catch (e) {
              loading = false;
              if (btn) btn.classList.remove('loading');
            }
          } else {
            loading = false;
            if (btn) btn.classList.remove('loading');
          }
        };
        xhr.onerror = function() {
          loading = false;
          if (btn) btn.classList.remove('loading');
        };
        xhr.send();
      } else {
        appendPosts();
      }
    }

    function appendPosts() {
      var start = page * perPage;
      var end = start + perPage;
      var items = postsCache.slice(start, end);
      var btn = document.getElementById('loadMoreBtn');

      if (items.length === 0) {
        allLoaded = true;
        loader.style.display = 'none';
        loading = false;
        return;
      }

      var frag = document.createDocumentFragment();
      for (var i = 0; i < items.length; i++) {
        var p = items[i];
        var card = document.createElement('article');
        card.className = 'post-card';
        card.style.opacity = '0';
        card.style.transform = 'translateY(16px)';
        card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
        
        var link = document.createElement('a');
        link.href = '/' + escapeHtml(p.url || '/');
        link.className = 'post-link';
        
        var title = document.createElement('h3');
        title.className = 'post-title';
        title.textContent = p.title || '';
        
        var excerpt = document.createElement('p');
        excerpt.className = 'post-excerpt';
        excerpt.textContent = p.excerpt || '';
        
        link.appendChild(title);
        link.appendChild(excerpt);
        
        var meta = document.createElement('div');
        meta.className = 'post-meta';
        
        var date = document.createElement('span');
        date.className = 'post-date';
        date.textContent = p.date || '';
        meta.appendChild(date);
        
        // if (p.categorySlug) {
        //   var cat = document.createElement('a');
        //   cat.href = '/c/' + escapeHtml(p.categorySlug) + '.html';
        //   cat.className = 'post-category';
        //   cat.textContent = p.category || '';
        //   meta.appendChild(cat);
        // }
        
        card.appendChild(link);
        card.appendChild(meta);
        frag.appendChild(card);
      }
      list.appendChild(frag);

      requestAnimationFrame(function() {
        var cards = list.querySelectorAll('.post-card');
        for (var i = cards.length - items.length; i < cards.length; i++) {
          (function(card, delay) {
            setTimeout(function() {
              card.style.opacity = '1';
              card.style.transform = 'translateY(0)';
            }, delay);
          })(cards[i], (i - (cards.length - items.length)) * 60);
        }
      });

      page++;
      loading = false;
      if (btn) btn.classList.remove('loading');

      if (end >= postsCache.length) {
        allLoaded = true;
        loader.style.display = 'none';
      }
    }

    var btn = document.getElementById('loadMoreBtn');
    if (btn) btn.addEventListener('click', loadPosts);

    var scrollTimer;
    window.addEventListener('scroll', function() {
      if (scrollTimer) clearTimeout(scrollTimer);
      scrollTimer = setTimeout(function() {
        var rect = loader.getBoundingClientRect();
        if (rect.top < window.innerHeight + 200) loadPosts();
      }, 100);
    });
  })();
  </script>
