<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>随机密码生成器</title>
  <style>
    :root {
      --bg: #f0f4ff;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: #eef2ff;
      --danger: #ef4444;
      --success: #10b981;
      --input-bg: #f9fafb;
      --toggle-bg: #e5e7eb;
      --toggle-thumb: #ffffff;
      --shadow: 0 4px 24px rgba(99,102,241,0.10);
      --shadow-lg: 0 8px 40px rgba(99,102,241,0.16);
      --strength-1: #ef4444;
      --strength-2: #f97316;
      --strength-3: #eab308;
      --strength-4: #10b981;
    }
    [data-theme="dark"] {
      --bg: #0f0f1a;
      --card-bg: #1a1a2e;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #2d2d4e;
      --accent: #818cf8;
      --accent-hover: #6366f1;
      --accent-light: #1e1e3a;
      --danger: #f87171;
      --success: #34d399;
      --input-bg: #0f0f1a;
      --toggle-bg: #2d2d4e;
      --toggle-thumb: #818cf8;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 60px;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Theme Toggle ── */
    .theme-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: var(--shadow);
      transition: all 0.2s;
      z-index: 100;
    }
    .theme-btn:hover { transform: scale(1.1); box-shadow: var(--shadow-lg); }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 40px 36px;
      width: 100%;
      max-width: 520px;
      border: 1px solid var(--border);
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .card-icon {
      font-size: 40px;
      margin-bottom: 12px;
      display: block;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* ── Password Output ── */
    .output-box {
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s, background 0.3s;
    }
    .output-box:focus-within {
      border-color: var(--accent);
    }
    #password-output {
      flex: 1;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      word-break: break-all;
      min-height: 28px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #password-output.flash { animation: pwd-flash 0.25s ease; }
    @keyframes pwd-flash {
      0% { opacity: 0.3; transform: translateY(-3px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .copy-btn {
      flex-shrink: 0;
      background: var(--accent-light);
      border: none;
      border-radius: 9px;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
      color: var(--accent);
    }
    .copy-btn:hover { background: var(--accent); color: #fff; transform: scale(1.08); }

    /* ── Copy Toast ── */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--success);
      color: #fff;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 200;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Strength Bar ── */
    .strength-wrap {
      margin-bottom: 24px;
    }
    .strength-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .strength-text { font-weight: 600; }
    .strength-bars {
      display: flex;
      gap: 5px;
    }
    .strength-bar {
      flex: 1;
      height: 5px;
      border-radius: 99px;
      background: var(--toggle-bg);
      transition: background 0.3s;
    }

    /* ── Controls ── */
    .section-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    /* Length slider */
    .length-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .length-val {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 36px;
      text-align: center;
    }
    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 99px;
      background: var(--toggle-bg);
      outline: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 0 4px var(--accent-light);
      transition: box-shadow 0.2s;
    }
    input[type="range"]:hover::-webkit-slider-thumb {
      box-shadow: 0 0 0 6px var(--accent-light);
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 0 4px var(--accent-light);
    }
    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 99px;
      background: var(--toggle-bg);
    }

    /* Toggles */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }
    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .option-item:hover { border-color: var(--accent); }
    .option-item.active {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .option-label {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
    }
    .option-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: var(--toggle-bg);
      border-radius: 99px;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--toggle-thumb);
      top: 3px;
      left: 3px;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(16px); }

    /* Exclude ambiguous */
    .exclude-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 28px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .exclude-row:hover { border-color: var(--accent); }
    .exclude-row.active { border-color: var(--accent); background: var(--accent-light); }

    /* ── Generate Buttons ── */
    .btn-row {
      display: flex;
      gap: 12px;
    }
    .btn-generate {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #a855f7);
      color: #fff;
      box-shadow: 0 4px 16px rgba(99,102,241,0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(99,102,241,0.45); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      background: var(--input-bg);
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Batch Section ── */
    .batch-section {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px dashed var(--border);
    }
    .batch-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }
    .batch-count-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .count-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--input-bg);
    }
    .stepper-btn {
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--accent);
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stepper-btn:hover { background: var(--accent-light); }
    .stepper-input {
      width: 44px;
      text-align: center;
      border: none;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
      padding: 0 4px;
      height: 32px;
      -moz-appearance: textfield;
    }
    .stepper-input::-webkit-inner-spin-button,
    .stepper-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .btn-batch {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      color: #fff;
      box-shadow: 0 2px 10px rgba(99,102,241,0.28);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-batch:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,0.38); }
    .btn-batch:active { transform: none; }

    /* Batch result list */
    .batch-result-wrap {
      display: none;
    }
    .batch-result-wrap.visible { display: block; }
    .batch-result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .batch-result-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .btn-copy-all {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-light);
      border: none;
      border-radius: 7px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-copy-all:hover { background: var(--accent); color: #fff; }
    .batch-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .batch-list::-webkit-scrollbar { width: 5px; }
    .batch-list::-webkit-scrollbar-track { background: transparent; }
    .batch-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    .batch-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 12px;
      transition: border-color 0.2s;
    }
    .batch-item:hover { border-color: var(--accent); }
    .batch-num {
      font-size: 0.72rem;
      color: var(--text-muted);
      min-width: 18px;
      text-align: right;
    }
    .batch-pwd {
      flex: 1;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.83rem;
      color: var(--text);
      word-break: break-all;
      cursor: pointer;
    }
    .batch-copy {
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px 5px;
      border-radius: 5px;
      border: none;
      background: none;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .batch-copy:hover { color: var(--accent); background: var(--accent-light); }

    /* ── History ── */
    .history-section {
      margin-top: 32px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-count {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: 6px;
    }
    .clear-btn {
      font-size: 0.78rem;
      color: var(--danger);
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .clear-btn:hover { background: rgba(239,68,68,0.1); }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .history-list::-webkit-scrollbar { width: 5px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .history-item:hover { border-color: var(--accent); }
    .history-pwd {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: var(--text);
      word-break: break-all;
      flex: 1;
      cursor: pointer;
    }
    .history-copy {
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      border: none;
      background: none;
      transition: all 0.2s;
    }
    .history-copy:hover { color: var(--accent); background: var(--accent-light); }
    .empty-history {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 16px 0;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .options-grid { grid-template-columns: 1fr; }
      .btn-row { flex-direction: column; }
      h1 { font-size: 1.3rem; }
      .batch-header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .batch-count-row { justify-content: center; }
      .btn-batch { width: 100%; text-align: center; }
    }

    /* Focus visible for keyboard nav */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button:focus:not(:focus-visible),
    input:focus:not(:focus-visible) {
      outline: none;
    }
  </style>
</head>
<body>

<button class="theme-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">🌙</button>

<div class="card">
  <div class="card-header">
    <span class="card-icon">🔐</span>
    <h1>随机密码生成器</h1>
    <p class="subtitle">安全、快速地生成强密码</p>
  </div>

  <!-- Output -->
  <div class="output-box">
    <span id="password-output" aria-live="polite">点击"生成密码"开始</span>
    <button class="copy-btn" id="copy-btn" title="复制密码" aria-label="复制密码">📋</button>
  </div>

  <!-- Strength -->
  <div class="strength-wrap">
    <div class="strength-label">
      <span>密码强度</span>
      <span class="strength-text" id="strength-text">—</span>
    </div>
    <div class="strength-bars">
      <div class="strength-bar" id="bar1"></div>
      <div class="strength-bar" id="bar2"></div>
      <div class="strength-bar" id="bar3"></div>
      <div class="strength-bar" id="bar4"></div>
    </div>
  </div>

  <!-- Length -->
  <div class="section-label">密码长度</div>
  <div class="length-row">
    <span class="length-val" id="length-display">16</span>
    <input type="range" id="length-slider" min="6" max="64" value="16" aria-label="密码长度" />
  </div>

  <!-- Options -->
  <div class="section-label">字符类型</div>
  <div class="options-grid">
    <label class="option-item active" id="opt-upper">
      <div>
        <div class="option-label">大写字母</div>
        <div class="option-sub">A–Z</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="use-upper" checked />
        <span class="slider"></span>
      </label>
    </label>
    <label class="option-item active" id="opt-lower">
      <div>
        <div class="option-label">小写字母</div>
        <div class="option-sub">a–z</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="use-lower" checked />
        <span class="slider"></span>
      </label>
    </label>
    <label class="option-item active" id="opt-number">
      <div>
        <div class="option-label">数字</div>
        <div class="option-sub">0–9</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="use-number" checked />
        <span class="slider"></span>
      </label>
    </label>
    <label class="option-item" id="opt-symbol">
      <div>
        <div class="option-label">特殊符号</div>
        <div class="option-sub">!@#$%^&amp;*</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="use-symbol" />
        <span class="slider"></span>
      </label>
    </label>
  </div>

  <!-- Exclude ambiguous -->
  <div class="exclude-row" id="opt-exclude">
    <div>
      <div class="option-label">排除易混淆字符</div>
      <div class="option-sub" style="font-size:0.75rem;color:var(--text-muted);">0 O o 1 l I 排除，避免看错</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="use-exclude" />
      <span class="slider"></span>
    </label>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn-generate btn-primary" id="generate-btn">⚡ 生成密码</button>
    <button class="btn-generate btn-secondary" id="refresh-btn" title="重新生成">🔄 刷新</button>
  </div>

  <!-- Batch Generate -->
  <div class="batch-section">
    <div class="batch-header">
      <div class="batch-count-row">
        <span class="count-label">批量生成</span>
        <div class="stepper">
          <button class="stepper-btn" id="count-minus" aria-label="减少">−</button>
          <input class="stepper-input" type="number" id="batch-count" value="5" min="1" max="20" aria-label="生成数量" />
          <button class="stepper-btn" id="count-plus" aria-label="增加">+</button>
        </div>
        <span class="count-label">条</span>
      </div>
      <button class="btn-batch" id="batch-btn">📋 批量生成</button>
    </div>
    <div class="batch-result-wrap" id="batch-result-wrap">
      <div class="batch-result-header">
        <span class="batch-result-label" id="batch-result-label"></span>
        <button class="btn-copy-all" id="copy-all-btn">复制全部</button>
      </div>
      <div class="batch-list" id="batch-list"></div>
    </div>
  </div>

  <!-- History -->
  <div class="history-section">
    <div class="history-header">
      <div class="section-label" style="margin:0">历史记录<span class="history-count" id="history-count"></span></div>
      <button class="clear-btn" id="clear-history">清空</button>
    </div>
    <div class="history-list" id="history-list">
      <p class="empty-history">暂无历史记录</p>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ 已复制到剪贴板</div>

<script>
  const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const LOWER = 'abcdefghijklmnopqrstuvwxyz';
  const DIGITS = '0123456789';
  const SYMBOLS = '!@#$%^&*()-_=+[]{}|;:,.<>?';
  const AMBIGUOUS = /[0Oo1lI]/g;

  const $ = id => document.getElementById(id);

  // Escape HTML entities to prevent XSS
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // State
  let history = JSON.parse(localStorage.getItem('pwdHistory') || '[]');

  // Theme
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  $('theme-toggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

  $('theme-toggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    $('theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
  });

  // Slider
  $('length-slider').addEventListener('input', () => {
    $('length-display').textContent = $('length-slider').value;
  });

  // Toggle option style
  ['upper','lower','number','symbol'].forEach(name => {
    const cb = $(`use-${name}`);
    const opt = $(`opt-${name}`);
    cb.addEventListener('change', () => {
      opt.classList.toggle('active', cb.checked);
    });
  });
  const excCb = $('use-exclude');
  excCb.addEventListener('change', () => {
    $('opt-exclude').classList.toggle('active', excCb.checked);
  });

  // Generate
    // Crypto-safe Fisher-Yates shuffle
    function cryptoShuffle(arr) {
      const res = [...arr];
      for (let i = res.length - 1; i > 0; i--) {
        const rnd = new Uint32Array(1);
        crypto.getRandomValues(rnd);
        const j = rnd[0] % (i + 1);
        [res[i], res[j]] = [res[j], res[i]];
      }
      return res;
    }

    function generatePassword() {
    const len = parseInt($('length-slider').value);
    const useUpper = $('use-upper').checked;
    const useLower = $('use-lower').checked;
    const useNum   = $('use-number').checked;
    const useSym   = $('use-symbol').checked;
    const exclude  = $('use-exclude').checked;

    if (!useUpper && !useLower && !useNum && !useSym) {
      showToast('⚠️ 请至少选择一种字符类型', '#f97316');
      return null;
    }

    let pool = '';
    const required = [];
    if (useUpper) { pool += UPPER; required.push(pickRandom(UPPER)); }
    if (useLower) { pool += LOWER; required.push(pickRandom(LOWER)); }
    if (useNum)   { pool += DIGITS; required.push(pickRandom(DIGITS)); }
    if (useSym)   { pool += SYMBOLS; required.push(pickRandom(SYMBOLS)); }

    if (exclude) {
      pool = pool.replace(AMBIGUOUS, '');
    }

    if (!pool) { return null; }

    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    let chars = required.slice();
    for (let i = chars.length; i < len; i++) {
      chars.push(pool[arr[i] % pool.length]);
    }
    return cryptoShuffle(chars).join('');
  }

  function pickRandom(str) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return str[arr[0] % str.length];
  }

  function calcStrength(pwd) {
    if (!pwd || pwd === '点击"生成密码"开始') return 0;
    let score = 0;
    if (pwd.length >= 8)  score++;
    if (pwd.length >= 14) score++;
    if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;
    if (score <= 1) return 1;
    if (score <= 2) return 2;
    if (score <= 3) return 3;
    return 4;
  }

  const strengthLabels = ['', '弱', '一般', '较强', '非常强'];
  const strengthColors = ['', 'var(--strength-1)', 'var(--strength-2)', 'var(--strength-3)', 'var(--strength-4)'];

  function updateStrength(pwd) {
    const level = calcStrength(pwd);
    const bars = [null, $('bar1'), $('bar2'), $('bar3'), $('bar4')];
    bars.slice(1).forEach((b, i) => {
      b.style.background = i < level ? strengthColors[level] : 'var(--toggle-bg)';
    });
    $('strength-text').textContent = pwd && level ? strengthLabels[level] : '—';
    $('strength-text').style.color = strengthColors[level] || 'var(--text-muted)';
  }

  function renderHistory() {
    const list = $('history-list');
    const countEl = $('history-count');
    if (history.length === 0) {
      list.innerHTML = '<p class="empty-history">暂无历史记录</p>';
      countEl.textContent = '';
      return;
    }
    countEl.textContent = `(${history.length}/100)`;
    list.innerHTML = history.slice().reverse().map((pwd, i) => `
      <div class="history-item" data-pwd="${encodeURIComponent(pwd)}">
        <span class="history-pwd" title="点击复制">${escapeHtml(pwd)}</span>
        <button class="history-copy" title="复制">📋</button>
      </div>
    `).join('');
  }

  function onGenerate() {
    const pwd = generatePassword();
    if (!pwd) return;
    const out = $('password-output');
    out.classList.remove('flash');
    // Force reflow to restart animation
    void out.offsetWidth;
    out.textContent = pwd;
    out.classList.add('flash');
    updateStrength(pwd);
    history.push(pwd);
    if (history.length > 100) history.shift();
    localStorage.setItem('pwdHistory', JSON.stringify(history));
    renderHistory();
  }

  $('generate-btn').addEventListener('click', onGenerate);
  $('refresh-btn').addEventListener('click', () => {
    onGenerate();
  });

  // Enter key to generate
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
      const tag = document.activeElement?.tagName;
      if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
        e.preventDefault();
        onGenerate();
      }
    }
  });

  // Click password output text to copy
  $('password-output').addEventListener('click', () => {
    const pwd = $('password-output').textContent;
    if (pwd && pwd !== '点击"生成密码"开始') copyText(pwd);
  });

  // ── Batch Generate ──
  function getBatchCount() {
    const v = parseInt($('batch-count').value) || 5;
    return Math.min(20, Math.max(1, v));
  }

  $('count-minus').addEventListener('click', () => {
    const cur = getBatchCount();
    if (cur > 1) $('batch-count').value = cur - 1;
  });
  $('count-plus').addEventListener('click', () => {
    const cur = getBatchCount();
    if (cur < 20) $('batch-count').value = cur + 1;
  });
  $('batch-count').addEventListener('change', () => {
    $('batch-count').value = getBatchCount();
  });

  // Store batch results for copy-all
  let batchResults = [];

  $('batch-btn').addEventListener('click', () => {
    const count = getBatchCount();
    batchResults = [];
    for (let i = 0; i < count; i++) {
      const pwd = generatePassword();
      if (!pwd) return;
      batchResults.push(pwd);
    }

    // Add to history
    batchResults.forEach(pwd => {
      history.push(pwd);
      if (history.length > 100) history.shift();
    });
    localStorage.setItem('pwdHistory', JSON.stringify(history));
    renderHistory();

    // Render batch list
    const wrap = $('batch-result-wrap');
    const list = $('batch-list');
    $('batch-result-label').textContent = `共生成 ${count} 条密码`;
    list.innerHTML = batchResults.map((pwd, i) => `
        <div class="batch-item" data-pwd="${encodeURIComponent(pwd)}">
          <span class="batch-num">${i + 1}.</span>
          <span class="batch-pwd" title="点击复制">${escapeHtml(pwd)}</span>
          <button class="batch-copy" title="复制">📋</button>
        </div>`).join('');
    wrap.classList.add('visible');
    // Scroll to results
    wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  $('copy-all-btn').addEventListener('click', () => {
    if (batchResults.length === 0) return;
    copyText(batchResults.join('\n'));
  });

  // ── Event Delegation for History & Batch Copy ──
  $('history-list').addEventListener('click', e => {
    const item = e.target.closest('.history-item');
    if (!item) return;
    const pwd = decodeURIComponent(item.dataset.pwd);
    if (pwd) copyText(pwd);
  });
  $('batch-list').addEventListener('click', e => {
    const item = e.target.closest('.batch-item');
    if (!item) return;
    const pwd = decodeURIComponent(item.dataset.pwd);
    if (pwd) copyText(pwd);
  });

  $('copy-btn').addEventListener('click', () => {
    const pwd = $('password-output').textContent;
    if (pwd && pwd !== '点击"生成密码"开始') copyText(pwd);
  });

  $('clear-history').addEventListener('click', () => {
    history = [];
    localStorage.removeItem('pwdHistory');
    renderHistory();
    $('history-count').textContent = '';
  });

  function copyText(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制到剪贴板'));
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('✅ 已复制到剪贴板');
    }
  }

  let toastTimer;
  function showToast(msg, bg) {
    const t = $('toast');
    t.textContent = msg;
    if (bg) t.style.background = bg;
    else t.style.background = '';
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Init
  renderHistory();
  updateStrength('');
  // Auto-generate on first visit
  onGenerate();
</script>
</body>
</html>
